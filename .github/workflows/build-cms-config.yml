name: Build CMS config

# Assembles admin/config.yml from admin/config.template.yml +
# admin/collections/*.yml + languages/en.json (see scripts/build-cms-config.js
# for the full explanation) whenever any of those source pieces change, so
# admin/config.yml itself never needs to be hand-edited or hand-kept-in-sync.
#
# Deliberately triggered on the *sources*, not on admin/config.yml itself
# (the paths filter below excludes it) -- otherwise this workflow's own
# commit would re-trigger itself. The `if` guard is a second, independent
# safety net against that same loop risk, matching minify-assets.yml's
# pattern exactly.
#
# Deliberately NOT tagged [skip ci], for the same reason documented in
# minify-assets.yml: admin/config.yml is served as part of the site (it's in
# eleventy.config.js's passthrough list), and deploy.yml should redeploy
# once it changes rather than sitting committed-but-undeployed until some
# unrelated later push happens to trigger a build.

on:
  push:
    branches:
      - main
    paths:
      - "admin/config.template.yml"
      - "admin/collections/**.yml"
      - "languages/en.json"
      - "languages/ta.json"
      - "scripts/build-cms-config.js"

permissions:
  contents: write

concurrency:
  group: build-cms-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin/config.yml
        run: node scripts/build-cms-config.js

      - name: Commit regenerated config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add admin/config.yml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-regenerate admin/config.yml from CMS config sources"
            git push
          else
            echo "No changes to commit"
          fi
