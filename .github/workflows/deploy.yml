name: Deploy to GitHub Pages

# Builds the Eleventy site (Phase 2 of the August 2026 technical audit)
# and publishes it via GitHub Pages' native Actions deployment, rather
# than the old "deploy from branch" mode that served the repo root
# directly. Nothing generated by this workflow is committed back to
# the repo -- the build output only ever exists as a Pages deployment
# artifact.
#
# Runs on every push to main (a full Eleventy build takes well under a
# minute for this site, so there's no need for path filtering) and can
# also be triggered manually. When minify-assets.yml auto-commits
# freshly minified CSS/JS, that follow-up commit is a normal push (see
# the comment in minify-assets.yml about why it is NOT tagged
# [skip ci]) and so re-triggers this workflow, keeping the deployed
# site's CSS/JS in sync with the latest minified output automatically.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer push supersede an
# in-flight older one rather than deploying stale content after fresh.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        run: npx eleventy

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
