name: Sync to diet.ac.in

# dietchn.ac.in (this repo's rvkmar/diet.ac.in deployment target) is
# the site's canonical public domain as of 2026-09-05 -- canonical
# link tags, sitemap.xml and robots.txt in the built output all point
# there. dietchennai.org keeps serving the identical content as a
# working mirror/alias.
#
# Editing and the Decap CMS admin pipeline still live entirely in THIS
# repo (dietwebsite) and stay on dietchennai.org -- dietchn.ac.in does
# not run its own admin (Cloudflare already blocks /admin on that
# domain at the edge). This workflow's job is only to keep dietchn.ac.in
# in sync with what dietchennai.org actually SERVES, by rsyncing the
# build output (_site/), not the Eleventy source files.
#
# Triggered by deploy.yml finishing, rather than by push directly, so
# the mirror always reflects a build that actually succeeded and
# deployed -- never a broken or stale one.

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types:
      - completed

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout dietwebsite repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        run: npx eleventy

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout diet.ac.in repository
        uses: actions/checkout@v4
        with:
          repository: rvkmar/diet.ac.in
          path: diet-repo
          fetch-depth: 0
          token: ${{ secrets.DIET_SYNC_TOKEN }}

      - name: Save current CNAME file
        run: cp diet-repo/CNAME /tmp/CNAME.backup

      - name: Sync built output
        run: |
          rsync -av --delete --exclude='.git' --exclude='CNAME' --exclude='.github' _site/ diet-repo/
          cp /tmp/CNAME.backup diet-repo/CNAME

      - name: Push to diet.ac.in
        run: |
          cd diet-repo
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync built site from dietwebsite (CNAME preserved)"
            git push origin main
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.DIET_SYNC_TOKEN }}
