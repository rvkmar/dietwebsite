name: Sync to rvkmar/diet.ac.in

on:
  push:
    # run on every push to any branch
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: sync-to-diet-ac-in
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch and remove CNAME
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          SRC_BRANCH="${GITHUB_REF#refs/heads/}"
          SYNC_BRANCH="sync-from-dietwebsite-${GITHUB_SHA::7}"
          echo "Sync branch: $SYNC_BRANCH"
          git checkout -B "$SYNC_BRANCH"
          # Remove CNAME if present
          if [ -f CNAME ]; then
            git rm -f CNAME || true
          fi
          git add -A
          # If there are no changes after removing CNAME, exit
          if git diff --cached --quiet; then
            echo "No changes to sync (after excluding CNAME)."
            exit 0
          fi
          git commit -m "Sync from rvkmar/dietwebsite ${SRC_BRANCH} ${GITHUB_SHA}"

      - name: Push to target repo
        env:
          TARGET_REPO: "rvkmar/diet.ac.in"
          TOKEN: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "ERROR: TARGET_REPO_PAT secret is not set in this repository. Create a PAT and add it as TARGET_REPO_PAT." >&2
            exit 1
          fi
          git remote add target https://x-access-token:${TOKEN}@github.com/${TARGET_REPO}.git
          # Force push the sync branch to the target repo
          git push --force target HEAD:refs/heads/$(git rev-parse --abbrev-ref HEAD)

      - name: Create Pull Request on target repo
        env:
          TARGET_REPO: "rvkmar/diet.ac.in"
          TOKEN: ${{ secrets.TARGET_REPO_PAT }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          SYNC_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          PR_TITLE="Sync from rvkmar/dietwebsite: ${GITHUB_REF#refs/heads/} ${GITHUB_SHA::7}"
          PR_BODY="Automated sync from rvkmar/dietwebsite excluding the CNAME file."
          # Build payload and create PR; if a PR already exists this will return an error but that's okay.
          PAYLOAD=$(jq -n --arg title "$PR_TITLE" --arg head "$SYNC_BRANCH" --arg base "main" --arg body "$PR_BODY" '{title:$title, head:$head, base:$base, body:$body}')
          echo "Creating PR on ${TARGET_REPO}: title='$PR_TITLE' head='$SYNC_BRANCH' base='main'"
          RESP=$(curl -s -w "\n%{http_code}" -X POST -H "Authorization: token ${TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${TARGET_REPO}/pulls -d "$PAYLOAD")
          echo "$RESP"
