name: Sync to diet.ac.in

on:
  push:
    branches:
      - main  # Change to master if your default branch is master

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Destination Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_PAT }}
        run: |
          # 1. Configure identities
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 2. Set the custom domain file
          echo "diet.ac.in" > CNAME
          git add CNAME
          git commit -m "Set production domain for diet.ac.in" || true
          
          # 3. Add the destination link
          git remote add destination https://x-access-token:${API_TOKEN_GITHUB}@://github.com

          # Added standard error capturing below
          git push destination main:main --force 2>&1
          
          # 4. Use the '+' prefix to forcefully overwrite the remote history
          git push destination +main:main

