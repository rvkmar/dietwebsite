name: Sync to diet.ac.in

on:
  push:
    branches:
      - main  # Change to master if your default branch is master

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Destination Repo
        env:
          API_TOKEN_GITHUB: ${{ secrets.SYNC_PAT }}
        run: |
          # 1. Configure identities
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 2. Set the custom domain file
          echo "diet.ac.in" > CNAME
          git add CNAME
          git commit -m "Set production domain for diet.ac.in" || true
          
          # 3. Add the correct destination repository URL (rvkmar/diet.ac.in)
          git remote add destination https://x-access-token:${API_TOKEN_GITHUB}@github.com/rvkmar/diet.ac.in.git
          
          # 4. Use the '+' prefix to bypass the unrelated histories block from your manual pushes
          git push destination +main:main
