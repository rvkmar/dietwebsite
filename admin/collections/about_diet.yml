  - name: "about_diet"
    label: "About DIET"
    delete: false
    files:
      - name: "about-diet"
        label: "About DIET"
        file: "src/about-diet/index.njk"
        format: "yaml-frontmatter"
        fields:
          - { label: "Layout (do not change)", name: "layout", widget: "hidden", default: "about-diet.njk" }
          - { label: "Title (browser tab / SEO)", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Last Updated", name: "last_updated", widget: "string", hint: "Format: DD-MMM-YYYY, e.g. 18-APR-2025" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            hint: "Each section is a bilingual heading + body. The third section's body includes its own sub-headings (as <h3>...</h3>) inside the same HTML block. Content stores as HTML (this codebase renders these fields with a plain pass-through, not a markdown-to-HTML step)."
            fields:
              - { label: "Heading (English)", name: "heading_en", widget: "string" }
              - { label: "Heading (Tamil)", name: "heading_ta", widget: "string" }
              - { label: "Body (English, HTML)", name: "body_en", widget: "markdown" }
              - { label: "Body (Tamil, HTML)", name: "body_ta", widget: "markdown" }
          - label: "Side images"
            name: "side_images"
            widget: "list"
            hint: "Shown stacked in the right-hand column, in order, separated by a divider line."
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string" }
