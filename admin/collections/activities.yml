  - name: "activities"
    label: "Activities"
    files:
      - name: "activ-calendar"
        label: "Academic Training Calendar — Page Content"
        file: "src/activ-calendar/index.njk"
        format: "yaml-frontmatter"
        fields: &activity_page_fields
          - { label: "Layout (do not change)", name: "layout", widget: "hidden", default: "activities.njk" }
          - { label: "Title (browser tab / SEO)", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Last Updated", name: "last_updated", widget: "string", hint: "Format: DD-MMM-YYYY, e.g. 18-APR-2025" }
          - label: "Introduction"
            name: "intro"
            widget: "object"
            required: false
            hint: "Optional explanatory text shown above the events list below."
            fields:
              - { label: "English", name: "en", widget: "markdown", required: false }
              - { label: "Tamil", name: "ta", widget: "markdown", required: false }
      - name: "activ-current"
        label: "Current Activities — Page Content"
        file: "src/activ-current/index.njk"
        format: "yaml-frontmatter"
        fields: *activity_page_fields
      - name: "activ-archive"
        label: "Activity Archive — Page Content"
        file: "src/activ-archive/index.njk"
        format: "yaml-frontmatter"
        fields: *activity_page_fields
      - name: "activ-alumni"
        label: "Alumni Association — Page Content"
        file: "src/activ-alumni/index.njk"
        format: "yaml-frontmatter"
        fields: *activity_page_fields
      - name: "activ-calendar-events"
        label: "Academic Training Calendar — Events List"
        file: "assets/content/data/activ-calendar.json"
        description: "Shown on the /activ-calendar/ page below the introduction."
        fields: &activity_list_fields
          - label: "Events"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD", required: false }
              - { label: "External Link (optional)", name: "link", widget: "string", required: false }
              - label: "Attach Document (optional)"
                name: "file"
                widget: "file"
                required: false
                media_folder: "/assets/docs"
                public_folder: "/assets/docs"
      - name: "activ-current-events"
        label: "Current Activities — Events List"
        file: "assets/content/data/activ-current.json"
        description: "Shown on the /activ-current/ page below the introduction."
        fields: *activity_list_fields
      - name: "activ-archive-events"
        label: "Activity Archive — Events List"
        file: "assets/content/data/activ-archive.json"
        description: "Shown on the /activ-archive/ page below the introduction."
        fields: *activity_list_fields
      - name: "activ-alumni-events"
        label: "Alumni Association — Events List"
        file: "assets/content/data/activ-alumni.json"
        description: "Shown on the /activ-alumni/ page below the introduction."
        fields: *activity_list_fields
