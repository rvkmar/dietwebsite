  - name: "contact_us"
    label: "Contact Us"
    delete: false
    format: "yaml-frontmatter"
    files:
      - name: "contact-us"
        label: "Contact Us"
        file: "src/contact-us/index.njk"
        description: "The institute name, address, email, phone, and map location are edited under Site Settings, not here (they're shared with other pages that reference the same facts)."
        fields:
          - { label: "Layout (do not change)", name: "layout", widget: "hidden", default: "contact-us.njk" }
          - { label: "Title (browser tab / SEO)", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Last Updated", name: "last_updated", widget: "string", hint: "Format: DD-MMM-YYYY, e.g. 18-APR-2025" }
