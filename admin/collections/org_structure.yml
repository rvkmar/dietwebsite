  - name: "org_structure"
    label: "Organization Structure"
    delete: false
    files:
      - name: "org-structure"
        label: "Organization Structure"
        file: "src/org-structure/index.njk"
        fields:
          - { label: "Layout (do not change)", name: "layout", widget: "hidden", default: "org-structure.njk" }
          - { label: "Title (browser tab / SEO)", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Last Updated", name: "last_updated", widget: "string", hint: "Format: DD-MMM-YYYY, e.g. 18-APR-2025" }
          - label: "Introduction"
            name: "intro"
            widget: "object"
            required: false
            hint: "Optional opening text shown above the org chart images. Leave both languages blank to skip it."
            fields:
              - { label: "English", name: "en", widget: "markdown", required: false }
              - { label: "Tamil", name: "ta", widget: "markdown", required: false }
          - label: "Organization chart images"
            name: "org_chart"
            widget: "object"
            required: false
            hint: "Unlike most images on this site, the chart image itself differs by language (it has the chart labels drawn in as text), not just the surrounding text -- so each language gets its own image here."
            fields:
              - { label: "Chart image (English)", name: "en", widget: "image", required: false }
              - { label: "Chart alt text (English)", name: "en_alt", widget: "string", required: false }
              - { label: "Chart image (Tamil)", name: "ta", widget: "image", required: false }
              - { label: "Chart alt text (Tamil)", name: "ta_alt", widget: "string", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            required: false
            hint: "Optional repeatable content blocks (e.g. an explanation of the structure), each with its own heading, bilingual body text, and an optional image."
            fields:
              - { label: "Heading (English)", name: "heading_en", widget: "string", required: false }
              - { label: "Heading (Tamil)", name: "heading_ta", widget: "string", required: false }
              - { label: "Body (English)", name: "body_en", widget: "markdown", required: false }
              - { label: "Body (Tamil)", name: "body_ta", widget: "markdown", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Image alt text", name: "image_alt", widget: "string", required: false }
