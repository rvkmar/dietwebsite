  - name: "principals_desk"
    label: "Principal's Desk"
    delete: false
    files:
      - name: "principals-desk"
        label: "Principal's Desk"
        file: "src/principals-desk/index.njk"
        fields:
          - { label: "Layout (do not change)", name: "layout", widget: "hidden", default: "principals-desk.njk" }
          - { label: "Title (browser tab / SEO)", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Last Updated", name: "last_updated", widget: "string", hint: "Format: DD-MMM-YYYY, e.g. 18-APR-2025" }
          - label: "Message heading (quote)"
            name: "message_heading"
            widget: "object"
            required: false
            hint: "Short quote-style heading shown above the message, e.g. an inspirational line."
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Tamil", name: "ta", widget: "string", required: false }
          - label: "Message"
            name: "message_body"
            widget: "object"
            required: false
            hint: "The Principal's message. Note: this field stores its content as HTML (wrap each paragraph in <p>...</p>) rather than plain markdown, to match how the rest of this page's bilingual text is rendered."
            fields:
              - { label: "English", name: "en", widget: "markdown", required: false }
              - { label: "Tamil", name: "ta", widget: "markdown", required: false }
          - label: "Closing signature"
            name: "closing_signature"
            widget: "object"
            required: false
            hint: "e.g. 'Principal / District Institute of Education and Training, Chennai'. Use <br> for a line break."
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Tamil", name: "ta", widget: "string", required: false }
