  - name: "simple_pages"
    label: "Simple Info / Policy Pages"
    delete: false
    files:
      - name: "disclaimer"
        label: "Disclaimer"
        file: "src/disclaimer/index.njk"
        fields: &simple_page_fields
          - { label: "Layout (do not change)", name: "layout", widget: "hidden", default: "simple-info.njk" }
          - { label: "Title (browser tab / SEO)", name: "title", widget: "string" }
          - { label: "Description (SEO)", name: "description", widget: "text" }
          - { label: "Last Updated", name: "last_updated", widget: "string", hint: "Format: DD-MMM-YYYY, e.g. 18-APR-2025" }
          - label: "Introduction"
            name: "intro"
            widget: "object"
            required: false
            hint: "Optional opening text shown above any sections below. Leave both languages blank to skip it."
            fields:
              - { label: "English", name: "en", widget: "markdown", required: false }
              - { label: "Tamil", name: "ta", widget: "markdown", required: false }
          - { label: "Introduction image", name: "intro_image", widget: "image", required: false }
          - { label: "Introduction image alt text", name: "intro_image_alt", widget: "string", required: false }
          - label: "Sections"
            name: "sections"
            widget: "list"
            required: false
            hint: "Optional repeatable content blocks, each with its own heading, bilingual body text, and an optional image. Leave empty for a page with only an introduction, or no content yet."
            fields:
              - { label: "Heading (English)", name: "heading_en", widget: "string", required: false }
              - { label: "Heading (Tamil)", name: "heading_ta", widget: "string", required: false }
              - { label: "Body (English)", name: "body_en", widget: "markdown", required: false }
              - { label: "Body (Tamil)", name: "body_ta", widget: "markdown", required: false }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Image alt text", name: "image_alt", widget: "string", required: false }
      - name: "terms-conditions"
        label: "Terms and Conditions"
        file: "src/terms-conditions/index.njk"
        fields: *simple_page_fields
      - name: "website-policies"
        label: "Website Policies"
        file: "src/website-policies/index.njk"
        fields: *simple_page_fields
      - name: "accessibility-statement"
        label: "Accessibility Statement"
        file: "src/accessibility-statement/index.njk"
        fields: *simple_page_fields
      - name: "help"
        label: "Help"
        file: "src/help/index.njk"
        fields: *simple_page_fields
      - name: "feedback"
        label: "Feedback"
        file: "src/feedback/index.njk"
        fields: *simple_page_fields
      - name: "important-links"
        label: "Important Links"
        file: "src/important-links/index.njk"
        fields: *simple_page_fields
      - name: "web-manager"
        label: "Web Information Manager"
        file: "src/web-manager/index.njk"
        fields: *simple_page_fields
      - name: "newsletters"
        label: "Newsletters"
        file: "src/newsletters/index.njk"
        fields: *simple_page_fields
      - name: "rti"
        label: "RTI"
        file: "src/rti/index.njk"
        fields: *simple_page_fields
      - name: "tb-module"
        label: "Textbooks and Modules: Modules"
        file: "src/tb-module/index.njk"
        fields: *simple_page_fields
      - name: "tb-textbook"
        label: "Textbooks and Modules: Textbooks"
        file: "src/tb-textbook/index.njk"
        fields: *simple_page_fields
      - name: "sitemap"
        label: "Sitemap"
        file: "src/sitemap/index.njk"
        fields: *simple_page_fields
      - name: "library"
        label: "Library"
        file: "src/library/index.njk"
        fields: *simple_page_fields
      - name: "mission-vision"
        label: "Mission and Vision"
        file: "src/mission-vision/index.njk"
        fields: *simple_page_fields
      - name: "roles-functions"
        label: "Roles and Functions"
        file: "src/roles-functions/index.njk"
        fields: *simple_page_fields
