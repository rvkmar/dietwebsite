# Decap CMS configuration for dietchennai.org
# Structured content (announcements, circulars, downloads, banner images,
# the last-updated date, and the photo gallery) lives in small JSON data
# files under assets/content/data/ and assets/content/gallery/, fetched and
# rendered at runtime by /js/cms-content.js. Editing those collections below
# is safe and will never break page layout.
#
# As of the Phase 2 Eleventy migration, every other page's content lives as
# an Eleventy template under src/<page>/index.njk (src/index.njk for the
# homepage, src/404.njk for 404), built to the page actually served on
# dietchennai.org. The shared header, navigation, and footer are NOT part of
# any individual page file any more -- they live once in src/_includes/ and
# apply to every page automatically, so editing a page here can no longer
# break the site-wide nav or footer the way editing the old flat HTML files
# could. Each entry in "All Website Pages" below points at the page's
# src/*.njk source (bottom of this file) as a raw-text fallback for content
# not covered by a structured collection above -- use carefully, and prefer
# the structured collections when the content you want to change is an
# announcement, circular, document, banner image, or the last-updated date.
# This CMS/admin pipeline is intended for dietchennai.org only -- the
# diet.ac.in mirror is a read-only replica and blocks /admin at Cloudflare.

backend:
  name: github
  repo: rvkmar/dietwebsite
  branch: main # Change to master if your default branch is master
  site_domain: dietchennai.org # Directs Decap to publish cleanly to your custom domain

# Adds a "View Site" link in the CMS's own top bar so you can jump straight
# to the live site without leaving /admin and typing the URL by hand.
site_url: https://dietchennai.org
display_url: https://dietchennai.org

# Editorial workflow: every save now goes through a draft -> in review ->
# ready to publish pipeline (with a preview link) instead of committing
# straight to main. See CMS_RESTRUCTURE_PLAN.md Section 5/6 phase 8. Cheap
# insurance even with a single editor today; easy to turn off again by
# removing this line and regenerating admin/config.yml.
publish_mode: editorial_workflow

# Media File Paths (default — used by the raw HTML pages and anywhere a
# field below doesn't override it)
media_folder: "images"
public_folder: "/images"

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General Settings"
        file: "assets/content/data/site-settings.json"
        description: "Site-wide facts used in more than one place: the 'Last Updated' date shown in the footer of every page, and the institute's name/address/email/phone shown on the Contact Us page."
        fields:
          - { label: "Last Updated (e.g. 18-APR-2025)", name: "last_updated", widget: "string" }
          - { label: "Institute Name", name: "institute_name", widget: "string", hint: "Shown at the top of the Contact Us page's address block." }
          - { label: "Address", name: "address", widget: "text", hint: "Shown on the Contact Us page. One field for the full address (street, city, PIN, state)." }
          - { label: "Email", name: "email", widget: "string", hint: "One or more addresses, comma-separated (e.g. 'admin@dietchennai.org, admin@dietchn.ac.in'). Shown as a clickable mailto link on the Contact Us page and used as the 'Send Us a Message' form's destination address(es)." }
          - { label: "Phone", name: "phone", widget: "string", hint: "Shown on the Contact Us page." }
          - { label: "Map link URL", name: "map_link_url", widget: "string", hint: "The 'View on Google Maps' link shown on the Contact Us page (a plain link, not an iframe embed -- Google Maps can't be framed under this site's Content-Security-Policy). Kept alongside the other contact facts since it describes the same address; update it if the address ever changes." }
          - label: "Logo"
            name: "logo_image"
            widget: "image"
            hint: "The main DIET Chennai emblem shown at the top-left of every page's header, and as the animated mark on the page-loading screen."
          - label: "Favicon"
            name: "favicon_image"
            widget: "image"
            hint: "The small icon shown in the browser tab and bookmarks for every page. Usually the same emblem as the Logo above, but kept as a separate field in case a simpler/square-cropped version ever works better as a tiny icon."
          - label: "Facebook page URL"
            name: "social_facebook"
            widget: "string"
            required: false
            hint: "Shown as the Facebook icon in the header's social-media menu. Opens in a new tab."
          - label: "Twitter / X page URL"
            name: "social_twitter"
            widget: "string"
            required: false
            hint: "Shown as the Twitter/X icon in the header's social-media menu. Opens in a new tab."
          - label: "YouTube channel URL"
            name: "social_youtube"
            widget: "string"
            required: false
            hint: "Shown as the YouTube icon in the header's social-media menu. Opens in a new tab."
  - name: "announcements"
    label: "Announcements"
    files:
      - name: "announcements"
        label: "Announcements List"
        file: "assets/content/data/announcements.json"
        description: "Shown on the homepage 'Announcements' tab and on the /announcements/ page."
        fields:
          - label: "Announcements"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD", required: false }
              - { label: "External Link (optional)", name: "link", widget: "string", required: false }
              - label: "Attach Document (optional)"
                name: "file"
                widget: "file"
                required: false
                media_folder: "/assets/docs"
                public_folder: "/assets/docs"

  - name: "circulars"
    label: "Circulars"
    files:
      - name: "circulars"
        label: "Circulars List"
        file: "assets/content/data/circulars.json"
        description: "Shown on the homepage 'Circulars' tab and on the /circulars/ page."
        fields:
          - label: "Circulars"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD", required: false }
              - { label: "External Link (optional)", name: "link", widget: "string", required: false }
              - label: "Attach Document (optional)"
                name: "file"
                widget: "file"
                required: false
                media_folder: "/assets/docs"
                public_folder: "/assets/docs"

  - name: "downloads"
    label: "Downloads / Documents"
    files:
      - name: "downloads"
        label: "Downloads (General)"
        file: "assets/content/data/downloads.json"
        description: "Shown on the homepage 'Downloads' tab and on /downloads/. For a form, publication, or report, use the dedicated collection below instead so it also appears on the right dedicated page."
        fields: &document_list_fields
          - label: "Documents"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD", required: false }
              - { label: "External Link (optional)", name: "link", widget: "string", required: false }
              - label: "Attach Document (optional)"
                name: "file"
                widget: "file"
                required: false
                media_folder: "/assets/docs"
                public_folder: "/assets/docs"
      - name: "forms"
        label: "Forms"
        file: "assets/content/data/forms.json"
        description: "Shown on the /doc-forms/ page."
        fields: *document_list_fields
      - name: "publications"
        label: "Publications"
        file: "assets/content/data/publications.json"
        description: "Shown on the /doc-publications/ page."
        fields: *document_list_fields
      - name: "reports"
        label: "Reports"
        file: "assets/content/data/reports.json"
        description: "Shown on the /reports/ page."
        fields: *document_list_fields
  - name: "banner"
    label: "Homepage Banner"
    files:
      - name: "banner"
        label: "Banner Slides"
        file: "assets/content/data/banner.json"
        description: "Images shown in the rotating banner at the top of the homepage."
        fields:
          - label: "Slides"
            name: "items"
            widget: "list"
            summary: "{{alt}}"
            fields:
              - label: "Image (English / default)"
                name: "image"
                widget: "image"
                media_folder: "/images/banner"
                public_folder: "/images/banner"
              - label: "Image (Tamil version, optional)"
                name: "image_ta"
                widget: "image"
                required: false
                media_folder: "/images/banner"
                public_folder: "/images/banner"
                hint: "If set, this replaces the English image above when a visitor switches the site to Tamil."
              - { label: "Alt Text", name: "alt", widget: "string", required: false }

  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery"
        label: "Gallery Images"
        file: "assets/content/gallery/gallery.json"
        description: "Photos shown on the /gallery/ page."
        fields:
          - label: "Photos"
            name: "images"
            widget: "list"
            field:
              label: "Photo"
              name: "image"
              widget: "image"
              media_folder: "/assets/content/gallery"
              public_folder: "/assets/content/gallery"

  - name: "academic_faculty"
    label: "Academic Faculty"
    files:
      - name: "academic_faculty"
        label: "Academic Faculty List"
        file: "assets/content/data/academic-faculty.json"
        description: "Shown on the /academic-faculty/ page (flip-cards with photo, name, designation, qualification, experience, email, phone). Reorder entries here to reorder the page; delete an entry to remove someone; add one for a new hire. The Principal is NOT listed here — edit the Principal collection below instead; their card is added to this page automatically."
        fields:
          - label: "Faculty Members"
            name: "items"
            widget: "list"
            summary: "{{name}} — {{designation}}"
            fields:
              - label: "Photo"
                name: "photo"
                widget: "image"
                media_folder: "/assets/staff"
                public_folder: "/assets/staff"
                media_library:
                  config:
                    max_file_size: 2097152 # 2 MB, in bytes
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Designation", name: "designation", widget: "string" }
              - { label: "Qualification", name: "qualification", widget: "text", required: false }
              - { label: "Teaching Experience", name: "experience", widget: "string", required: false, hint: "e.g. '24 years'" }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }

  - name: "principal"
    label: "Principal"
    files:
      - name: "principal_profile"
        label: "Principal's Photo & Profile"
        file: "assets/content/data/principal.json"
        description: "The Principal's photo, name, and designation — used on the Academic Faculty card, the homepage, the Principal's Desk page, and the Mandatory Disclosure document. Edit it here once and it updates everywhere; no other collection controls this anymore."
        fields:
          - label: "Photo"
            name: "photo"
            widget: "image"
            media_folder: "/images"
            public_folder: "/images"
            media_library:
              config:
                max_file_size: 2097152 # 2 MB, in bytes
          - { label: "Name", name: "name", widget: "string", hint: "Used everywhere: this card, the homepage, Principal's Desk page, and the Mandatory Disclosure document." }
          - { label: "Name (Tamil)", name: "name_ta", widget: "string", required: false, hint: "Shown on the homepage and Principal's Desk page when a visitor switches to Tamil. Leave blank to just keep showing the English name in Tamil mode too." }
          - { label: "Designation (short, for this card)", name: "designation", widget: "string", hint: "Shown only on this Academic Faculty card, e.g. 'Principal' \u2014 matches the style of every other faculty member's card." }
          - { label: "Designation (full title, for homepage/desk/disclosure)", name: "designation_long", widget: "string", hint: "e.g. 'Principal, DIET Chennai' \u2014 shown on the homepage, Principal's Desk page, and the Mandatory Disclosure document." }
          - { label: "Designation (full title, Tamil)", name: "designation_long_ta", widget: "string", required: false }
          - { label: "Qualification", name: "qualification", widget: "text", required: false }
          - { label: "Teaching Experience", name: "experience", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "Phone", name: "phone", widget: "string", required: false }
      # Note: the Principal's Name & Designation (principalname /
      # principaldesignation keys, English + Tamil) are edited via the
      # "Site Translations" collection instead of here, since that
      # collection now covers every key in languages/en.json and
      # languages/ta.json, including these two.
      - name: "principal_disclosure"
        label: "Mandatory Disclosure Document (raw HTML)"
        file: "assets/docs/mandatory_disclosure.html"
        description: "The Principal's name appears TWICE in this legal/RTI document (as a listed detail and as a signature line) and is plain static text, not linked to the fields above — you must update both occurrences yourself if the Principal changes."
        fields:
          - { label: "Full page HTML source", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

  - name: "admin_staff"
    label: "Non-Academic Staff"
    files:
      - name: "admin_staff"
        label: "Non-Academic Staff List"
        file: "assets/content/data/admin-staff.json"
        description: "Shown on the /admin-staff/ page (flip-cards with photo, name, designation, qualification, experience, email, phone). Reorder entries here to reorder the page; delete an entry to remove someone; add one for a new hire."
