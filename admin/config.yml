        fields: *department_fields
      - name: "dept-ae"
        label: "Department: AE"
        file: "src/dept-ae/index.njk"
        fields: *department_fields
      - name: "dept-fiar"
        label: "Department: FIAR"
        file: "src/dept-fiar/index.njk"
        fields: *department_fields
      - name: "departments"
        label: "Departments (index)"
        file: "src/departments/index.njk"
        fields: *department_fields
