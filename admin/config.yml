# Authentication Backend
backend:
  name: github
  repo: rvkmar/dietwebsite
  branch: main # Change to master if your default branch is master
  site_domain: www.dietchennai.org # Directs Decap to publish cleanly to your custom domain

# Media File Paths
media_folder: "images" # Folder where site images are stored
public_folder: "/images" # Path used in HTML src attributes

# Content Structuring 
collections:
  - name: "pages"
    label: "Website Pages"
    delete: false # Prevents deleting core website structure
    editor:
      preview: false # Disable previews for raw standalone HTML
    files:
      - name: "home"
        label: "Home Page"
        file: "index.html"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Main Body Content", name: "body", widget: "markdown" }

      - name: "about"
        label: "About Page"
        file: "about.html" # Ensure about.html exists at your repository root
        fields:
          - { label: "About Title", name: "title", widget: "string" }
          - { label: "About Text", name: "body", widget: "markdown" }
