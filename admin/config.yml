# Decap CMS configuration for dietchennai.org
# This site is pure static HTML with no build step, so structured content
# (announcements, circulars, downloads, banner images, the last-updated date,
# and the photo gallery) lives in small JSON data files under
# assets/content/data/ and assets/content/gallery/, fetched and rendered at
# runtime by /js/cms-content.js. Editing those collections below is safe and
# will never break page layout.
#
# Every other page is also editable as a raw HTML source file (bottom of this
# file, "All Website Pages" collection) as a fallback, but editing raw HTML
# can break page layout if markup is deleted or malformed — use carefully,
# and prefer the structured collections above when the content you want to
# change is an announcement, circular, document, banner image, or the
# last-updated date.

backend:
  name: github
  repo: rvkmar/dietwebsite
  branch: main # Change to master if your default branch is master
  site_domain: www.dietchennai.org # Directs Decap to publish cleanly to your custom domain

# Media File Paths (default — used by the raw HTML pages and anywhere a
# field below doesn't override it)
media_folder: "images"
public_folder: "/images"

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General Settings"
        file: "assets/content/data/site-settings.json"
        description: "Controls the 'Last Updated' date shown in the footer of every page."
        fields:
          - { label: "Last Updated (e.g. 18-APR-2025)", name: "last_updated", widget: "string" }

  - name: "announcements"
    label: "Announcements"
    files:
      - name: "announcements"
        label: "Announcements List"
        file: "assets/content/data/announcements.json"
        description: "Shown on the homepage 'Announcements' tab and on the /announcements/ page."
        fields:
          - label: "Announcements"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD", required: false }
              - { label: "External Link (optional)", name: "link", widget: "string", required: false }
              - label: "Attach Document (optional)"
                name: "file"
                widget: "file"
                required: false
                media_folder: "/assets/docs"
                public_folder: "/assets/docs"

  - name: "circulars"
    label: "Circulars"
    files:
      - name: "circulars"
        label: "Circulars List"
        file: "assets/content/data/circulars.json"
        description: "Shown on the homepage 'Circulars' tab and on the /circulars/ page."
        fields:
          - label: "Circulars"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD", required: false }
              - { label: "External Link (optional)", name: "link", widget: "string", required: false }
              - label: "Attach Document (optional)"
                name: "file"
                widget: "file"
                required: false
                media_folder: "/assets/docs"
                public_folder: "/assets/docs"

  - name: "downloads"
    label: "Downloads / Documents"
    files:
      - name: "downloads"
        label: "Downloads, Forms, Publications & Reports"
        file: "assets/content/data/downloads.json"
        description: "Shown on the homepage 'Downloads' tab and on /downloads/, /doc-forms/, /doc-publications/, /doc-reports/. Use Category to route an entry to the right page."
        fields:
          - label: "Documents"
            name: "items"
            widget: "list"
            summary: "{{title}} ({{category}})"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "date", date_format: "YYYY-MM-DD", required: false }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["forms", "publications", "reports"]
                hint: "Determines whether this appears on /doc-forms/, /doc-publications/, or /doc-reports/. It always also appears on /downloads/."
              - { label: "External Link (optional)", name: "link", widget: "string", required: false }
              - label: "Attach Document (optional)"
                name: "file"
                widget: "file"
                required: false
                media_folder: "/assets/docs"
                public_folder: "/assets/docs"

  - name: "banner"
    label: "Homepage Banner"
    files:
      - name: "banner"
        label: "Banner Slides"
        file: "assets/content/data/banner.json"
        description: "Images shown in the rotating banner at the top of the homepage."
        fields:
          - label: "Slides"
            name: "items"
            widget: "list"
            summary: "{{alt}}"
            fields:
              - label: "Image (English / default)"
                name: "image"
                widget: "image"
                media_folder: "/images/banner"
                public_folder: "/images/banner"
              - label: "Image (Tamil version, optional)"
                name: "image_ta"
                widget: "image"
                required: false
                media_folder: "/images/banner"
                public_folder: "/images/banner"
                hint: "If set, this replaces the English image above when a visitor switches the site to Tamil."
              - { label: "Alt Text", name: "alt", widget: "string", required: false }

  - name: "gallery"
    label: "Photo Gallery"
    files:
      - name: "gallery"
        label: "Gallery Images"
        file: "assets/content/gallery/gallery.json"
        description: "Photos shown on the /gallery/ page."
        fields:
          - label: "Photos"
            name: "images"
            widget: "list"
            field:
              label: "Photo"
              name: "image"
              widget: "image"
              media_folder: "/assets/content/gallery"
              public_folder: "/assets/content/gallery"

  - name: "about_fragments"
    label: "About / Roles Content"
    files:
      - name: "about_mission"
        label: "Mission & Vision content (embedded on /mission-vision/)"
        file: "assets/content/about_mission.html"
        fields:
          - { label: "Full page HTML source", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }
      - name: "about_roles"
        label: "Roles & Functions content (embedded on /roles-functions/)"
        file: "assets/content/about_roles.html"
        fields:
          - { label: "Full page HTML source", name: "body", widget: "code", default_language: "html", allow_language_selection: false, output_code_only: true }

  - name: "pages"
    label: "All Website Pages (raw HTML)"
    delete: false # Prevents deleting core website structure
    files:
      - name: "404"
        label: "404 (raw HTML)"
        file: "404.html"
        fields:
          - label: "Full page HTML source"
            name: "body"
            widget: "code"
            default_language: "html"
            allow_language_selection: false
            output_code_only: true
            hint: "This edits the ENTIRE raw HTML file, including navigation and footer. Use with care — for announcements, circulars, downloads, banners, and the last-updated date, use the dedicated sections above instead."
      - name: "about-diet-chennai"
