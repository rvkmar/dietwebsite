<!DOCTYPE html>
<html lang="en-us"
    prefix="content: http://purl.org/rss/1.0/modules/content/ dc: http://purl.org/dc/terms/ foaf: http://xmlns.com/foaf/0.1/ og: http://ogp.me/ns# rdfs: http://www.w3.org/2000/01/rdf-schema# sioc: http://rdfs.org/sioc/ns# sioct: http://rdfs.org/sioc/types# skos: http://www.w3.org/2004/02/skos/core# xsd: http://www.w3.org/2001/XMLSchema#">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>
        [ng\:cloak],
        [ng-cloak],
        [data-ng-cloak],
        [x-ng-cloak],
        .ng-cloak,
        .x-ng-cloak,
        .ng-hide:not(.ng-hide-animate) {
            display: none !important;
        }

        ng\:form {
            display: block;
        }

        .ng-animate-shim {
            visibility: hidden;
        }

        .ng-anchor {
            position: absolute;
        }
    </style>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found</title>
    <meta name="description" content="The page you are looking for could not be found. It may have been moved, renamed, or removed.">
    <style>
        body { margin: 0; font-family: "Open Sans", Arial, sans-serif; background: #f5f5f5; color: #333; }
        .error { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
        .error .container { max-width: 640px; }
        .error .content.centered { text-align: center; }
        .error img { max-width: 100%; height: auto; }
        .error h1 { font-size: 28px; margin: 16px 0 8px; }
        .error .sub-header { margin: 0; color: #555; }
    </style>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i,800,800i"
        rel="stylesheet">

</head>

<body>

    <div class="error" id="error">
        <div class="container">
            <div class="content centered"><img src="/assets/404.png" alt="404 error" style="width:70%;">
                <h1>Page Not Found</h1>
                <p style="font-size:22px;" class="sub-header text-block-narrow">The page you are looking for could not be found. It may have been moved, renamed, or removed.</p>
                <p style="font-size:18px;"><a href="/">Return to the homepage</a></p>
            </div>
        </div>
    </div>
</body>

</html>
